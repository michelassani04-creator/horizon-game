name: Build backend HORIZON

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests et JAR
        run: gradle test buildFatJar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-backend-jar
          path: backend/build/libs/horizon-backend.jar
