name: Release APK signé

# Lancement manuel : onglet Actions > « Release APK signé » > Run workflow.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restaurer la keystore
        env:
          KEYSTORE_B64: ${{ secrets.HORIZON_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Secret HORIZON_KEYSTORE_B64 absent"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/horizon-release.jks"

      - name: Compiler l'APK release signé
        env:
          HORIZON_KEYSTORE_FILE: ${{ runner.temp }}/horizon-release.jks
          HORIZON_KEYSTORE_PASSWORD: ${{ secrets.HORIZON_KEYSTORE_PASSWORD }}
          HORIZON_KEY_ALIAS: ${{ secrets.HORIZON_KEY_ALIAS }}
          HORIZON_KEY_PASSWORD: ${{ secrets.HORIZON_KEY_PASSWORD }}
          HORIZON_API_URL: ${{ secrets.HORIZON_API_URL }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Supprimer la keystore du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/horizon-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonGame-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
